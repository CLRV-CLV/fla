<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FLA</title>
<style>
:root{--bg:#0b0b0c;--card:#17171a;--card2:#202024;--line:rgba(255,255,255,.08);--mut:#8b8b93;--ink:#f5f5f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"HarmonyOS Sans SC","MiSans","PingFang SC",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7vh) 22px 22px;background:radial-gradient(120% 55% at 50% 0%,#232327 0%,var(--bg) 62%)}
.logo{width:72px;height:72px;border-radius:22px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:23px;letter-spacing:-1px;box-shadow:0 14px 44px rgba(255,255,255,.12)}
h1{font-size:26px;margin:18px 0 4px}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:26px;text-align:center}
.line{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;width:100%;max-width:380px;margin-bottom:18px}
.line button{flex:1;background:none;padding:9px 4px;border-radius:11px;font-size:13px;color:var(--mut)}
.line button.on{background:var(--ink);color:#000;font-weight:600}
.scanBig{width:100%;max-width:380px;border-radius:20px;background:#fff;color:#000;padding:19px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:700}
.scanBig:active,.card:active{transform:scale(.98)}
.or{display:flex;align-items:center;gap:12px;color:#5c5c63;font-size:12.5px;width:100%;max-width:380px;margin:24px 0 16px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.codes{display:flex;gap:12px;justify-content:center;position:relative;margin-bottom:16px}
.codes span{width:60px;height:70px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.codes span.cur{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.codes input{position:absolute;inset:0;opacity:0;font-size:16px}
.btn{width:100%;max-width:380px;border-radius:14px;padding:14px;font-size:15px;background:var(--card2);font-weight:600}
.section-title{width:100%;max-width:380px;margin:4px 0 -18px;color:var(--mut);font-size:13px;font-weight:600;text-align:left}
.feat{width:100%;max-width:380px;margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.home-grid{margin-top:24px}
.card{color:inherit;text-decoration:none;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.card svg{margin-bottom:8px;color:#fff}
.card b{display:block;font-size:14px}.card small{color:var(--mut);font-size:12px}
.cast-entry{width:100%;max-width:380px;margin-top:14px;display:flex;align-items:center;gap:12px;text-align:left;padding:15px;background:linear-gradient(135deg,#232327,#17171a);border:1px solid rgba(255,255,255,.15);border-radius:16px}
.cast-entry .i{width:26px;height:26px}.cast-entry span:nth-child(2){flex:1}.cast-entry b,.cast-entry small{display:block}.cast-entry small{margin-top:3px;color:var(--mut);font-size:12px}.cast-entry .arrow{font-size:28px;color:var(--mut)}
.connect{width:100%;max-width:380px;margin-top:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);overflow:hidden}
.connect summary{padding:13px 15px;color:var(--mut);font-size:13px;cursor:pointer;list-style:none}
.connect summary::-webkit-details-marker{display:none}.connect summary:after{content:"＋";float:right;color:var(--mut)}.connect[open] summary:after{content:"−"}
.connect-body{display:flex;flex-direction:column;align-items:center;padding:0 14px 16px}
.connect-hint{max-width:none;margin:0 0 12px;font-size:12px}
.connect .line{max-width:none}.connect .scanBig,.connect .or,.connect .btn{max-width:none}.connect .codes{gap:8px}
.foot{margin-top:auto;padding-top:26px;color:#4d4d54;font-size:12px;text-align:center}
#scan{position:fixed;inset:0;z-index:30;background:#000;display:none}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#scan .box{width:68vmin;height:68vmin;border-radius:24px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);position:relative;border:3px solid rgba(255,255,255,.9)}
#scan .laser{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:ls 2s ease-in-out infinite}
@keyframes ls{0%,100%{top:8%}50%{top:92%}}
#scan .t{position:absolute;left:0;right:0;bottom:120px;text-align:center;color:#eee;font-size:14px}
#scan .x{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center}
#msg{position:fixed;top:40px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:12px;display:none;z-index:40;font-size:13.5px;font-weight:500;max-width:86vw;text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="i-mon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
</svg>
<div class="wrap">
  <div class="logo">FLA</div>
  <h1>FLA 课堂助手</h1>
  <div class="sub">课件、课堂交流、AI 助教与手机投屏，一站使用</div>
  <div class="section-title">常用功能</div>
  <div class="feat home-grid" id="site">
    <a class="card" data-to="library"><svg class="i"><use href="#i-mon"/></svg><b>课件库</b><small>查看 · 上传 · 放映</small></a>
    <a class="card" data-to="ai"><svg class="i"><use href="#i-ai"/></svg><b>AI 助教</b><small>备课 · 答疑 · 写作</small></a>
    <a class="card" data-to="chat"><svg class="i"><use href="#i-pen"/></svg><b>课堂交流</b><small>同事消息与讨论</small></a>
    <a class="card" data-to="forum"><svg class="i"><use href="#i-board"/></svg><b>教学论坛</b><small>公告 · 经验分享</small></a>
    <a class="card" data-to="profile"><svg class="i"><use href="#i-phone"/></svg><b>个人中心</b><small>账号 · 存储空间</small></a>
  </div>
  <button class="cast-entry" id="castEntry"><svg class="i"><use href="#i-cam"/></svg><span><b>手机投屏 / 课堂遥控</b><small>连接电脑后可整屏投放、观看大屏、翻页批注和实物展台</small></span><span class="arrow">›</span></button>
  <details class="connect" id="connectPane">
    <summary>连接教室电脑</summary>
    <div class="connect-body">
      <div class="sub connect-hint">请先在电脑端工具栏点「手机」，再扫码或输入 4 位配对码</div>
      <div class="line" id="line"><button data-i="0">线路一 t.clrv.top</button><button data-i="1">线路二 t.fyx.best</button></div>
      <button class="scanBig" id="scanBtn"><svg class="i" style="width:24px;height:24px"><use href="#i-scan"/></svg>扫码连接</button>
      <div class="or">或输入配对码</div>
      <div class="codes" id="codes"><span></span><span></span><span></span><span></span><input id="pi" inputmode="numeric" pattern="[0-9]*" maxlength="4"></div>
      <button class="btn" id="go">连接</button>
    </div>
  </details>
  <div class="foot" id="ver">FLA</div>
</div>
<div id="scan">
  <video id="sv" playsinline muted></video>
  <div class="mask"><div class="box"><div class="laser"></div></div></div>
  <div class="t">将电脑上的二维码放入框内</div>
  <button class="x" id="sx"><svg class="i"><use href="#i-x"/></svg></button>
</div>
<div id="msg"></div>
<script src="jsqr.min.js"></script>
<script>
(function () {
  var SERVERS = ['https://t.clrv.top', 'https://t.fyx.best'];
  var $ = function (id) { return document.getElementById(id); };
  var N = window.FLA || {};
  function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { m.style.display = 'none'; }, 2600); }
  var li = +(localStorage.getItem('line') || 0);
  function paintLine() { [].forEach.call($('line').children, function (b) { b.classList.toggle('on', +b.dataset.i === li); }); }
  [].forEach.call($('line').children, function (b) { b.onclick = function () { li = +b.dataset.i; localStorage.setItem('line', li); paintLine(); }; });
  paintLine();
  [].forEach.call(document.querySelectorAll('#site a[data-to]'), function (a) {
    a.onclick = function () { location.href = SERVERS[li] + '/#/' + a.dataset.to; };
  });
  $('castEntry').onclick = function () {
    $('connectPane').open = true;
    setTimeout(function () { $('connectPane').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 20);
  };
  if (N.version) $('ver').textContent = 'FLA 手机端 v' + N.version();

  var pi = $('pi'), boxes = $('codes').children;
  function paint() {
    var v = pi.value.replace(/\D/g, '').slice(0, 4); pi.value = v;
    for (var i = 0; i < 4; i++) { boxes[i].textContent = v[i] || ''; boxes[i].classList.toggle('cur', i === v.length && document.activeElement === pi); }
    if (v.length === 4) { pi.blur(); pair(v); }
  }
  pi.oninput = pi.onfocus = pi.onblur = paint;
  $('go').onclick = function () { pi.value.length === 4 ? pair(pi.value) : pi.focus(); };

  function pair(c) {
    $('go').textContent = '正在连接…';
    N.pair(SERVERS[li], c);         // 原生请求 (跨域) → 回调 window.onPair
  }
  window.onPair = function (ok, srv, sid, c, err) {
    $('go').textContent = '连接';
    if (!ok) { toast(err || '配对码无效，请确认电脑已打开「手机」面板'); return; }
    location.href = srv + '/cast.html?sid=' + encodeURIComponent(sid) + '&code=' + encodeURIComponent(c);
  };

  /* 扫码 */
  var st = null, raf = 0, cvs = document.createElement('canvas'), cx = cvs.getContext('2d', { willReadFrequently: true });
  function close() { cancelAnimationFrame(raf); if (st) st.getTracks().forEach(function (t) { t.stop(); }); st = null; $('scan').style.display = 'none'; }
  $('sx').onclick = close;
  function handleScan(t) {
    t = String(t || '').trim(); var u = null;
    try { u = new URL(t); } catch (e) { }
    if (u && u.searchParams.get('sid') && u.searchParams.get('code')) { N.vibrate && N.vibrate(); location.href = u.href; return; }
    if (/^\d{4}$/.test(t)) { pi.value = t; paint(); return; }
    toast('这不是 FLA 电脑端的二维码');
  }
  window.onScan = handleScan;            // iOS: 原生扫码回调
  $('scanBtn').onclick = function () {
    if (N.scanNative) { N.scanNative(); return; }
    $('scan').style.display = 'block';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false }).then(function (s) {
      st = s; var v = $('sv'); v.srcObject = s; v.play(); var last = 0;
      (function tick(ts) {
        raf = requestAnimationFrame(tick);
        if (!v.videoWidth || ts - last < 110) return; last = ts;
        var k = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight));
        cvs.width = v.videoWidth * k | 0; cvs.height = v.videoHeight * k | 0;
        cx.drawImage(v, 0, 0, cvs.width, cvs.height);
        var r = jsQR(cx.getImageData(0, 0, cvs.width, cvs.height).data, cvs.width, cvs.height, { inversionAttempts: 'dontInvert' });
        if (!r || !r.data) return;
        close(); handleScan(r.data);
      })(0);
    }).catch(function () { close(); toast('无法打开相机，请在系统设置中允许 FLA 使用相机'); });
  };
})();
</script>
</body>
</html>
