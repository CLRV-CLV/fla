# 复制到仓库 .github/workflows/android.yml 即可启用 (沙箱无 workflow 推送权限, 需在 GitHub 网页上手动新建)
# 每次 mobile/android 有改动: 自动编译签名好的 APK, 提交到 desktop/bin/FLA-cast.apk, 服务器 run.sh pull 后网站即可下载
name: Android APK
on:
  push:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        working-directory: mobile/android
        run: gradle assembleRelease --no-daemon
      - name: Commit APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk desktop/bin/FLA-cast.apk
          git config user.name "fla-bot"
          git config user.email "fla-bot@users.noreply.github.com"
          git add desktop/bin/FLA-cast.apk
          git commit -m "android: 自动构建 FLA.apk [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with: { name: FLA-apk, path: desktop/bin/FLA-cast.apk }
