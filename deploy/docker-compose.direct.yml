# FLA 直连模式: app 容器直接发布端口
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      network: host   # 构建时用宿主机网络/DNS (避免 docker 网桥 DNS 解析失败)
    container_name: fla
    restart: unless-stopped
    command: ["sh", "-c", "exec uvicorn server.main:app --host 0.0.0.0 --port \"$${PORT:-8306}\" --workers 1 --proxy-headers --forwarded-allow-ips '*'"]
    ports:
      - "${PORT:-8306}:${PORT:-8306}"
      - "${RTMP_PORT:-1935}:1935"   # iPhone 整屏投屏 (RTMP)
    environment:
      - PORT=${PORT:-8306}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=Asia/Hong_Kong
      - MALLOC_ARENA_MAX=2   # v1.26 内存优化: 限制 glibc 分配区
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - APP_INTERNAL_URL=${APP_INTERNAL_URL:-http://127.0.0.1:${PORT:-8306}}
    volumes:
      - fla-data:/data
      - ../web:/app/web
      - ../server:/app/server
      - ../desktop:/app/desktop
      - /etc/fla/ssl:/etc/fla/ssl:ro   # 只读: 用 HTTPS 证书签名 iOS 描述文件
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  documentserver:
    profiles: ["full"]
    image: onlyoffice/documentserver:latest
    container_name: fla-onlyoffice
    restart: unless-stopped
    ports:
      - "${DS_PORT:-8880}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
      - TZ=Asia/Hong_Kong
    mem_limit: 2300m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  fla-data:
    name: fla-data
