# FLA - 统一入口 (nginx, 完整模式: 含 OnlyOffice)
# 上游地址用变量 + Docker 内置 DNS 运行时解析: 即使某个上游暂时不可解析,
# nginx 也能正常启动(请求时再解析), 避免启动即崩溃的循环重启
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# v1.27 修: 前面还有宿主机边缘 nginx(80/443)时, 不能把 X-Forwarded-Proto 覆盖成 http,
# 否则应用永远以为自己是 http → 微软放映直链生成 http、ms_ok 判定失败、安全上下文丢失。
map $http_x_forwarded_proto $fla_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $fla_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2048m;      # 允许大课件上传

    # v1.26: 压缩文本资源(js/css/json ~70%↓)
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 内置 DNS

    # ---- OnlyOffice 文档服务器 (子路径 /ds/, 支持 WebSocket) ----
    location /ds/ {
        rewrite /ds/(.*) /$1 break;
        set $ds_upstream http://documentserver;
        proxy_pass $ds_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host/ds;
        proxy_set_header X-Forwarded-Proto $fla_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- 应用本体 ----
    location / {
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        proxy_set_header Host $fla_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $fla_host;
        proxy_set_header X-Forwarded-Proto $fla_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        # v1.27: 聊天实时推送走 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;          # 音视频 Range / 流式上传
        proxy_request_buffering off;  # 大文件直传
    }
}
