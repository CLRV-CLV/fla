# FLA - 统一入口 (nginx, 精简模式: 无 OnlyOffice)
# v1.27: 本文件自包含(map 也在这里), 因为完整/精简配置只会启用其中一份
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# 修: 前面还有宿主机边缘 nginx(80/443)时, 不要把 X-Forwarded-Proto 覆盖成 http
map $http_x_forwarded_proto $fla_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $fla_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2048m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 内置 DNS, 运行时解析上游

    location / {
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        proxy_set_header Host $fla_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $fla_host;
        proxy_set_header X-Forwarded-Proto $fla_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;          # 音视频 Range / 流式上传
        proxy_request_buffering off;  # 大文件直传
    }
}
